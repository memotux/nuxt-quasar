name: ci

on:
  push:
    branches:
      - main
  pull_request:

# Rapid pushes to the same PR would otherwise queue duplicate runs. Cancel the
# superseded run for pull requests, but let main runs finish: cancelling on main
# would leave a commit without a CI record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Playground prepare
        run: npm run dev:prepare

      # No browser is installed in this job on purpose: a browser-dependent
      # test that lands here fails loudly instead of passing unverified.
      # Browser tests belong to the test-browser job below.
      - name: Test (unit + SSR wiring)
        run: npm run test:no-browser

  test-browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Playground prepare
        run: npm run dev:prepare

      # The key must change exactly when the browser BUILD changes, because this
      # key gates a *skip* of `playwright install` below. Hashing the committed
      # lockfile cannot express that: the install step is not frozen, so the
      # resolved Playwright version may differ from the version whose binaries
      # populated the cache, and a stale hit then launches a mismatched build in a
      # way that looks like a Playwright bug rather than a cache defect. Hashing a
      # lockfile that is ever absent also collapses the key to one permanent
      # entry. Reading the version out of the installed package keys the cache on
      # the thing that actually selects the download, and fails the job loudly if
      # the package is not there.
      - name: Resolve installed Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # The cache holds browser binaries only, never the OS libraries, so a
      # cache hit still needs the system dependencies installed.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test (browser hydration e2e)
        run: npm run test:browser
